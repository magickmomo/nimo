name: World 003 new architecture 50-decision experiment
on:
  push:
    branches: [experiment/world-003-compact-cognition]
    paths: ['.github/workflows/world-003-new-50.yml']
concurrency:
  group: world-003-new-50-experiment
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  verify-and-run:
    runs-on: ubuntu-latest
    environment: world-004
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install worker dependencies
        run: npm install --prefix world-worker --no-audit --no-fund
      - name: Offline verification
        run: |
          npm run typecheck --prefix world-worker
          npm test --prefix world-worker
          node world-worker/scripts/cognition-experiment.mjs profile "$RUNNER_TEMP/nimo-results"
      - name: Run 50 new-architecture decisions in an isolated database
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node world-worker/scripts/cognition-experiment.mjs paid "$RUNNER_TEMP/nimo-results"
      - name: Export decision, usage, evidence and outcome records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-003-experiential-memory
          path: ${{ runner.temp }}/nimo-results/*.json
          if-no-files-found: ignore
