name: Nimo lab cognition tests
on:
  pull_request:
    paths:
      - "web/lib/cognition-009.ts"
      - "web/lib/cognition-011.ts"
      - "web/app/world/lab/009/**"
      - "web/app/world/lab/011/**"
      - "web/tests/cognition-009.test.mjs"
      - "web/tests/cognition-011.test.mjs"
      - ".github/workflows/nimo-lab-tests.yml"
  workflow_dispatch:
jobs:
  cognition-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm ci --prefix web
      - name: Run Nimo cognition tests
        run: node --test web/tests/cognition-009.test.mjs web/tests/cognition-011.test.mjs
      - name: Type-check website
        run: npm run typecheck --prefix web
