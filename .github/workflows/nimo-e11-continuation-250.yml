name: Nimo E11 continuation decisions 101-250

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/nimo-e11-memory-search
    paths:
      - .github/workflows/nimo-e11-continuation-250.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: nimo-e11-continuation-250
  cancel-in-progress: false

jobs:
  experiment:
    name: Resume original E11 database for 150 more decisions
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # The existing OPENAI_API_KEY is scoped to this GitHub Actions environment.
    # It only provides the key; the experiment remains an isolated local SQLite run.
    environment: world-004
    env:
      NIMO_CORE_UNIFIED: '1'
      NIMO_CORE_RICH_CONSOLIDATION: '1'
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      EXPERIMENT_DIR: ${{ github.workspace }}/nimo-e11-continuation-250
      DB: ${{ github.workspace }}/nimo-e11-continuation-250/experiment.sqlite3
    steps:
      - name: Checkout exact experiment commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare isolated run directory
        run: mkdir -p "$EXPERIMENT_DIR"

      - name: Offline tests (no model expense)
        working-directory: nimo-core
        run: |
          python -m compileall -q .
          NIMO_CORE_RICH_CONSOLIDATION=0 NIMO_CORE_UNIFIED=0 python -m unittest -v

      - name: Unified offline smoke test
        working-directory: nimo-core
        run: |
          python -u nimo_core.py --db "$EXPERIMENT_DIR/smoke.sqlite3" run --mock --decisions 10
          python - <<'PY'
          import os, sqlite3, json
          db = sqlite3.connect(os.path.join(os.environ["EXPERIMENT_DIR"], "smoke.sqlite3"))
          assert db.execute("select count(*) from decisions where status='completed'").fetchone()[0] == 10
          assert db.execute("select count(*) from memories").fetchone()[0] == 1
          for (raw,) in db.execute("select context_json from decisions"):
              assert "current_intention" not in json.loads(raw)
              assert "latest_thinking" not in json.loads(raw)
              assert "identity" not in json.loads(raw)
          for (raw,) in db.execute("select reflection from memories"):
              assert set(json.loads(raw)) == {"episodic", "semantic", "reflective"}
          for (raw,) in db.execute("select request_json from model_calls"):
              assert "objective_summary" not in json.loads(raw)["input"]
              assert "identity_note" not in json.loads(raw)["input"]
          assert db.execute("select count(*) from memories where tentative_identity_note is not null").fetchone()[0] == 0
          for (raw,) in db.execute("select request_json from model_calls"):
              messages = json.loads(raw)["input"]
              assert isinstance(messages, str)
              if json.loads(raw).get("tools"):
                  assert messages.split("\n\n", 1)[0] == "You are Nimo. Choose your next action."
              elif json.loads(messages.split("\n\n", 1)[1]).get("purpose") == "consolidate":
                  assert messages.startswith("Consolidate the supplied memories and experiences")
                  assert "You are Nimo." not in messages.split("\n\n", 1)[0]
          assert db.execute("select count(*) from think_notes where purpose='thought' and next_step is null").fetchone()[0] > 0
          PY

      - name: Verify historical memory retrieval offline
        working-directory: nimo-core
        run: |
          python - <<'PY'
          import tempfile, pathlib, json
          import nimo_core as n
          with tempfile.TemporaryDirectory() as d:
              db=n.open_db(str(pathlib.Path(d)/"test.sqlite3"))
              for i in range(1,6):
                  db.execute("INSERT INTO memories(cycle_end_decision,created_at,objective_summary,reflection,evidence_decision_ids_json,status) VALUES(?,?,?,?,?,?)",(i*10,n.now(),"{}",json.dumps({"semantic":"Galileo telescope" if i==1 else "fern", "episodic":"", "reflective":""}),json.dumps([i]),"reflected"))
              assert n.search_memory(db,"Galileo")[0]["cycle_end_decision"]==10
              assert n.search_memory(db,"Galileo")[0]["evidence_decision_ids"]==[1]
              assert n.search_memory(db,"unmatched")==[]
              assert len(n.search_memory(db,"fern"))==3
              assert n.search_memory(db,'"""')==[]
              db.execute("INSERT INTO decisions(id,started_at,context_json,offered_json,status) VALUES(1,?,?,?,?)",(n.now(),"{}","[]","completed"))
              n.execute(db,n.MockAI(),1,"search_memory",{},{"query":"Galileo"})
              db.execute("UPDATE state SET attempted=1 WHERE id=1")
              n.run_one(db,n.MockAI())
              context=json.loads(db.execute("SELECT context_json FROM decisions WHERE id=2").fetchone()[0])
              assert context["memory_search_results"]["matches"][0]["cycle_end_decision"]==10
          PY

      - name: Restore original E11 artifact
        uses: actions/download-artifact@v4
        with:
          name: nimo-e11-continuation-100-audit
          run-id: 45877460134
          github-token: ${{ github.token }}
          path: ${{ env.EXPERIMENT_DIR }}
      - name: Verify original database before continuation
        run: |
          python - <<'PY'
          import os, sqlite3
          db=sqlite3.connect("file:"+os.environ["DB"]+"?mode=ro",uri=True)
          assert db.execute("pragma integrity_check").fetchone()[0]=="ok"
          assert db.execute("select attempted from state").fetchone()[0]==100
          assert db.execute("select count(*) from decisions where status='completed'").fetchone()[0]==100
          assert db.execute("select count(*) from memories").fetchone()[0]==10
          assert db.execute("select count(*) from model_calls").fetchone()[0]==110
          PY

      - name: Check API credential before making any paid calls
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Missing OPENAI_API_KEY in GitHub Actions environment world-004 or repository secrets."
            exit 1
          fi

      - name: Run 150 live decisions in fifteen capped batches
        shell: bash
        working-directory: nimo-core
        run: |
          set -euo pipefail
          test -f "$DB" || { echo "::error::Original DB missing"; exit 1; }
          for batch in $(seq 1 15); do
            echo "===== Nimo Core server batch $batch/15 =====" | tee -a "$EXPERIMENT_DIR/terminal.log"
            python -u nimo_core.py --db "$DB" run --live --decisions 10 2>&1 | tee -a "$EXPERIMENT_DIR/terminal.log"
          done

      - name: Verify continuation reached 250 decisions
        run: |
          python -c 'import sqlite3,os; db=sqlite3.connect(os.environ["DB"]); assert db.execute("select attempted from state").fetchone()[0]==250'

      - name: Create complete auditable report and machine-readable summary
        if: always()
        shell: bash
        working-directory: nimo-core
        run: |
          set -euo pipefail
          if [ -f "$DB" ]; then
            python nimo_core.py --db "$DB" report --out "$EXPERIMENT_DIR/audit.html"
            python export_server_experiment.py --db "$DB" --out "$EXPERIMENT_DIR/summary.json" | tee "$EXPERIMENT_DIR/summary-brief.log"
          else
            echo "No experiment database was created (offline tests or credential check failed)." > "$EXPERIMENT_DIR/NO_RUN.txt"
          fi

      - name: Print memory contents and token usage for review
        if: always()
        working-directory: nimo-core
        run: |
          python - <<'PY'
          import os, sqlite3, json
          if os.path.exists(os.environ["DB"]):
              db = sqlite3.connect(os.environ["DB"])
              db.row_factory = sqlite3.Row
              for row in db.execute("select * from memories order by cycle_end_decision"):
                  print("E11_MEMORY=" + json.dumps(dict(row), ensure_ascii=False))
              for row in db.execute("select * from memory_searches order by decision_id"):
                  print("E11_SEARCH=" + json.dumps(dict(row), ensure_ascii=False))
              for row in db.execute("select purpose,usage_json from model_calls"):
                  print("E11_USAGE=" + json.dumps(dict(row)))
              for row in db.execute("select kind,title,content from artifacts where kind != 'drawing'"):
                  print("E11_ARTIFACT=" + json.dumps(dict(row), ensure_ascii=False))
          PY

      - name: Preserve SQLite, full HTML audit, decision log, and summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nimo-e11-continuation-250-audit
          path: ${{ env.EXPERIMENT_DIR }}/
          retention-days: 14
          if-no-files-found: error



