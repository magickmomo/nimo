name: Reset Nimo to a fresh life (manual only)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type ERASE NIMO to permanently reset his learned state'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nimo-world-production-deploy
  cancel-in-progress: false

jobs:
  fresh-start:
    if: ${{ inputs.confirm == 'ERASE NIMO' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
      D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
      WORKER_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Check required Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          for key in CLOUDFLARE_ACCOUNT_ID D1_DATABASE_ID D1_API_TOKEN WORKER_API_TOKEN; do
            test -n "${!key}" || { echo "::error::Missing $key"; exit 1; }
          done
          [[ "$D1_DATABASE_ID" =~ ^[0-9a-fA-F-]{36}$ ]] || { echo "::error::Invalid D1 ID"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check Worker and reset SQL locally
        run: |
          npm install --prefix world-worker --no-audit --no-fund
          npm test --prefix world-worker
          npm run typecheck --prefix world-worker
          python3 world-worker/reset/test_fresh_start.py

      - name: Prepare temporary Wrangler configuration
        working-directory: world-worker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          template=Path('wrangler.toml.example').read_text()
          placeholder='REPLACE_WITH_YOUR_D1_DATABASE_ID'
          assert template.count(placeholder)==1
          Path('wrangler.toml').write_text(template.replace(placeholder,os.environ['D1_DATABASE_ID']))
          PY

      - name: Require Nimo asleep before backup or deployment
        working-directory: world-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute nimo-world --remote --json --command 'SELECT autonomous_enabled FROM world_control WHERE id=1' > "$RUNNER_TEMP/nimo-control.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          data=json.loads((Path(os.environ['RUNNER_TEMP'])/'nimo-control.json').read_text())
          entries=data if isinstance(data,list) else [data]
          assert all(e.get('success') is True for e in entries)
          rows=[r for e in entries for r in e.get('results',[])]
          if len(rows)!=1 or rows[0].get('autonomous_enabled')!=0:
            raise SystemExit('Nimo must be put to sleep in /world/settings before this operation.')
          print('Confirmed Nimo asleep.')
          PY

      - name: Capture a Cloudflare D1 Time Travel recovery bookmark
        working-directory: world-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler d1 time-travel info nimo-world --json > "$RUNNER_TEMP/nimo-bookmark.json"
          python3 - <<'PY'
          import json,os,re
          from pathlib import Path
          data=json.loads((Path(os.environ['RUNNER_TEMP'])/'nimo-bookmark.json').read_text())
          bookmarks=re.findall(r'\b[0-9a-f]{8}-[0-9a-f-]{20,}\b',json.dumps(data),re.I)
          if not bookmarks: raise SystemExit('No recovery bookmark found; refusing reset.')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
            f.write('### Nimo recovery point before fresh start\n')
            f.write('Cloudflare D1 Time Travel bookmark: `'+bookmarks[0]+'`\n')
            f.write('Restore using `wrangler d1 time-travel restore nimo-world --bookmark=BOOKMARK` if needed.\n')
          print('Recovery bookmark recorded in the workflow summary.')
          PY

      - name: Verify complete D1 backup export before any destructive action
        working-directory: world-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler d1 export nimo-world --remote --output="$RUNNER_TEMP/nimo-before-reset.sql"
          test -s "$RUNNER_TEMP/nimo-before-reset.sql"
          grep -q 'CREATE TABLE' "$RUNNER_TEMP/nimo-before-reset.sql"
          sha256sum "$RUNNER_TEMP/nimo-before-reset.sql"
          echo 'Complete D1 export verified on runner; intentionally not uploaded to public GitHub artifacts.'
          echo 'Persistent recovery is available through the Cloudflare Time Travel bookmark above.'

      - name: Deploy discovery-first Worker before resetting state
        working-directory: world-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy

      - name: Confirm Nimo is still asleep immediately before reset
        working-directory: world-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute nimo-world --remote --json --command 'SELECT autonomous_enabled FROM world_control WHERE id=1' > "$RUNNER_TEMP/nimo-control-final.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          data=json.loads((Path(os.environ['RUNNER_TEMP'])/'nimo-control-final.json').read_text())
          entries=data if isinstance(data,list) else [data]
          rows=[r for e in entries for r in e.get('results',[])]
          if any(e.get('success') is not True for e in entries) or rows!=[{'autonomous_enabled':0}]:
            raise SystemExit('Nimo is no longer confirmed asleep; refusing reset.')
          PY

      - name: Reset all learned state and history
        working-directory: world-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: npx wrangler d1 execute nimo-world --remote --file=reset/fresh-start.sql

      - name: Verify clean state before allowing manual wake
        working-directory: world-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute nimo-world --remote --json --command "SELECT (SELECT json_extract(state,'$.tickCount') FROM world WHERE id=1) AS ticks, (SELECT json_array_length(json_extract(state,'$.beliefs')) FROM world WHERE id=1) AS beliefs, (SELECT autonomous_enabled FROM world_control WHERE id=1) AS awake, (SELECT COUNT(*) FROM documents) AS docs, (SELECT COUNT(*) FROM world_seen) AS seen, (SELECT COUNT(*) FROM world_food_memory) AS food_memories, (SELECT COUNT(*) FROM garden_inventory) AS items, (SELECT COUNT(*) FROM events) AS journal_rows" > "$RUNNER_TEMP/nimo-new-life.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          data=json.loads((Path(os.environ['RUNNER_TEMP'])/'nimo-new-life.json').read_text())
          entries=data if isinstance(data,list) else [data]
          if any(e.get('success') is not True for e in entries): raise SystemExit('Verification query failed')
          rows=[r for e in entries for r in e.get('results',[])]
          if len(rows)!=1 or rows[0]!={'ticks':0,'beliefs':0,'awake':0,'docs':0,'seen':0,'food_memories':0,'items':0,'journal_rows':1}:
            raise SystemExit('Reset verification failed: '+str(rows))
          print('Verified Nimo fresh state; still asleep. Wake manually in /world/settings.')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
            f.write('\n### Fresh start completed\nNimo is asleep with no prior memories. Wake him in /world/settings.\n')
          PY
