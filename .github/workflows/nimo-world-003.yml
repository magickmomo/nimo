name: Nimo World 003 checks
on:
  pull_request:
    paths:
      - 'world-worker/**'
      - 'web/**'
      - '.github/workflows/nimo-world-003.yml'
  push:
    branches: [feature/nimo-003-vision-navigation, feature/nimo-0032a-object-memory-action-monitor]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install worker dependencies
        run: npm install --prefix world-worker --no-audit --no-fund
      - name: Test complete fresh-start reset against a populated database
        run: python3 world-worker/reset/test_fresh_start.py
      - name: Install website dependencies
        run: npm install --prefix web --no-audit --no-fund
      - name: Validate D1 migration SQL syntax
        run: |
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path
          db = sqlite3.connect(":memory:")
          db.executescript(Path("world-worker/migrations/006_journeys_and_vision.sql").read_text())
          assert db.execute("SELECT status FROM world_journey WHERE id=1").fetchone() == ("idle",)
          db.executescript(Path("world-worker/migrations/007_object_memory_and_actions.sql").read_text())
          assert db.execute("SELECT COUNT(*) FROM sqlite_master WHERE name IN ('object_observations','object_notes','action_trace')").fetchone()[0] == 3
          db.executescript(Path("world-worker/migrations/008_world_rewards.sql").read_text())
          assert db.execute("SELECT COUNT(*) FROM sqlite_master WHERE name='world_rewards'").fetchone()[0] == 1
          db.execute("INSERT OR IGNORE INTO world_rewards(source_key,action,points,detail) VALUES ('one','inspect',12,'first')")
          db.execute("INSERT OR IGNORE INTO world_rewards(source_key,action,points,detail) VALUES ('one','inspect',12,'duplicate')")
          assert db.execute("SELECT COUNT(*),SUM(points) FROM world_rewards").fetchone() == (1,12)
          # Earlier migration fixtures do not create the original events table.
          db.execute("CREATE TABLE events (id INTEGER PRIMARY KEY, kind TEXT, action TEXT)")
          # Verify 009 counts stay accurate after insert and idempotent backfill.
          db.executescript(Path("world-worker/migrations/009_d1_read_budget.sql").read_text())
          db.execute("INSERT INTO object_observations(object_id,properties_json,comparison) VALUES (?,?,?)",("tree_003","{}","first"))
          db.execute("INSERT INTO object_observations(object_id,properties_json,comparison) VALUES (?,?,?)",("tree_003","{}","unchanged"))
          assert db.execute("SELECT total FROM object_observation_counts WHERE object_id='tree_003'").fetchone() == (2,)
          db.executescript(Path("world-worker/migrations/009_d1_read_budget.sql").read_text())
          assert db.execute("SELECT total FROM object_observation_counts WHERE object_id='tree_003'").fetchone() == (2,)
          # Live 16x16 migration preserves old records and expands coordinate checks.
          db.execute("CREATE TABLE world_position(id INTEGER PRIMARY KEY,x INTEGER CHECK(x BETWEEN 0 AND 8),y INTEGER CHECK(y BETWEEN 0 AND 8),updated_at TEXT NOT NULL)")
          db.execute("INSERT INTO world_position VALUES(1,4,4,'original')")
          db.execute("CREATE TABLE world_visited(x INTEGER CHECK(x BETWEEN 0 AND 8),y INTEGER CHECK(y BETWEEN 0 AND 8),visit_count INTEGER,first_visited TEXT,last_visited TEXT,PRIMARY KEY(x,y))")
          db.execute("INSERT INTO world_visited VALUES(4,4,3,'first','last')")
          db.execute("CREATE TABLE world_inspected(x INTEGER CHECK(x BETWEEN 0 AND 8),y INTEGER CHECK(y BETWEEN 0 AND 8),kind TEXT,description TEXT,inspection_count INTEGER,last_inspected TEXT,PRIMARY KEY(x,y))")
          db.execute("INSERT INTO world_inspected VALUES(1,1,'tree','known',2,'inspected')")
          db.execute("DROP TABLE world_seen")
          db.execute("CREATE TABLE world_seen(x INTEGER CHECK(x BETWEEN 0 AND 8),y INTEGER CHECK(y BETWEEN 0 AND 8),first_seen TEXT,PRIMARY KEY(x,y))")
          db.execute("INSERT INTO world_seen VALUES(4,4,'saw')")
          db.executescript(Path("world-worker/migrations/010_world_16x16.sql").read_text())
          assert db.execute("SELECT x,y,updated_at FROM world_position").fetchone() == (4,4,'original')
          assert db.execute("SELECT visit_count,first_visited FROM world_visited").fetchone() == (3,'first')
          assert db.execute("SELECT inspection_count FROM world_inspected").fetchone() == (2,)
          assert db.execute("SELECT first_seen FROM world_seen").fetchone() == ('saw',)
          db.execute("UPDATE world_position SET x=15,y=15 WHERE id=1")
          db.execute("INSERT INTO world_seen(x,y) VALUES(15,15)")
          db.executescript(Path("world-worker/migrations/011_allotment_economy.sql").read_text())
          assert db.execute("SELECT COUNT(*) FROM garden_plots").fetchone()[0] == 3
          assert db.execute("SELECT COUNT(*) FROM garden_inventory").fetchone()[0] == 0
          db.execute("CREATE TABLE world_settings(id INTEGER PRIMARY KEY,hunger_rate REAL NOT NULL,updated_at TEXT)")
          db.execute("INSERT INTO world_settings(id,hunger_rate,updated_at) VALUES(1,0.1,'original')")
          db.executescript(Path("world-worker/migrations/012_fullness_rate.sql").read_text())
          assert abs(db.execute("SELECT hunger_rate FROM world_settings").fetchone()[0]-1/60)<1e-12
          db.execute("UPDATE world_settings SET hunger_rate=0.2 WHERE id=1")
          db.executescript(Path("world-worker/migrations/012_fullness_rate.sql").read_text())
          assert db.execute("SELECT hunger_rate FROM world_settings").fetchone() == (0.2,)
          db.execute("INSERT INTO garden_inventory(kind,water_units) VALUES('watering_can',3)")
          assert db.execute("SELECT water_units FROM garden_inventory").fetchone() == (3,)
          db.execute("INSERT INTO garden_transactions(source_key,action,detail) VALUES('test','plant_seed','one')")
          db.execute("INSERT OR IGNORE INTO garden_transactions(source_key,action,detail) VALUES('test','plant_seed','duplicate')")
          assert db.execute("SELECT COUNT(*) FROM garden_transactions").fetchone() == (1,)
          PY
      - name: Worker TypeScript
        run: npm run typecheck --prefix world-worker
      - name: Navigation tests
        run: npm run test --prefix world-worker
      - name: Website TypeScript
        run: npm run typecheck --prefix web
