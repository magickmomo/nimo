name: Deploy Nimo D1 row-read fix

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY after sleeping Nimo and backing up the D1 database"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: nimo-world-production-deploy
  cancel-in-progress: false

jobs:
  migrate-and-deploy:
    if: ${{ inputs.confirm == 'DEPLOY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
      D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate settings and Worker
        shell: bash
        run: |
          set -euo pipefail
          for k in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN D1_API_TOKEN D1_DATABASE_ID; do
            test -n "${!k}" || { echo "::error::Missing $k"; exit 1; }
          done
          [[ "$D1_DATABASE_ID" =~ ^[0-9a-fA-F-]{36}$ ]] || exit 1
          npm install --prefix world-worker --no-audit --no-fund
          npm run typecheck --prefix world-worker
          npm test --prefix world-worker
      - name: Generate Wrangler configuration
        working-directory: world-worker
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          config=Path("wrangler.toml.example").read_text()
          assert config.count("REPLACE_WITH_YOUR_D1_DATABASE_ID")==1
          Path("wrangler.toml").write_text(config.replace("REPLACE_WITH_YOUR_D1_DATABASE_ID",os.environ["D1_DATABASE_ID"]))
          PY
      - name: Check Nimo is asleep
        working-directory: world-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute nimo-world --remote --json --command 'SELECT autonomous_enabled FROM world_control WHERE id=1' > "$RUNNER_TEMP/sleep.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          entries=json.loads((Path(os.environ["RUNNER_TEMP"])/"sleep.json").read_text())
          if not isinstance(entries,list):entries=[entries]
          assert entries and all(e.get("success") is True for e in entries)
          rows=[r.get("autonomous_enabled") for e in entries for r in e.get("results",[])]
          if rows!=[0]:raise SystemExit("Nimo must be put to sleep before this migration.")
          PY
      - name: Apply additive migration 009 to D1
        working-directory: world-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: npx wrangler d1 execute nimo-world --remote --file=migrations/009_d1_read_budget.sql
      - name: Verify D1 migration before Worker deployment
        working-directory: world-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute nimo-world --remote --json --command "SELECT name FROM sqlite_master WHERE name IN ('object_observation_counts','object_observations_count_insert')" > "$RUNNER_TEMP/schema.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          entries=json.loads((Path(os.environ["RUNNER_TEMP"])/"schema.json").read_text())
          if not isinstance(entries,list):entries=[entries]
          assert entries and all(e.get("success") is True for e in entries)
          names={r.get("name") for e in entries for r in e.get("results",[])}
          assert {"object_observation_counts","object_observations_count_insert"}<=names, "Migration 009 is incomplete"
          PY
      - name: Deploy updated Nimo Worker
        working-directory: world-worker
        run: npm run deploy
