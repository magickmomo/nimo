name: Deploy Nimo World Worker (manual and migration-safe)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release to deploy (003.2A includes 003.1)'
        required: true
        type: choice
        options:
          - '003.1'
          - '003.2A'
          - 'current-main'
      confirm:
        description: 'Type DEPLOY after putting Nimo to sleep and backing up D1'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nimo-world-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirm == 'DEPLOY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
      D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
      WORKER_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          for key in CLOUDFLARE_ACCOUNT_ID D1_DATABASE_ID D1_API_TOKEN WORKER_API_TOKEN; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing required GitHub secret/variable: $key"
              exit 1
            fi
          done
          if [[ ! "$D1_DATABASE_ID" =~ ^[0-9a-fA-F-]{36}$ ]]; then
            echo "::error::CLOUDFLARE_D1_DATABASE_ID must be a UUID."
            exit 1
          fi
      - name: Check out the exact release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version == 'current-main' && 'main' || (inputs.version == '003.2A' && 'feature/nimo-0032a-object-memory-action-monitor' || 'feature/nimo-003-vision-navigation') }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Worker dependencies
        working-directory: world-worker
        run: npm install --no-audit --no-fund
      - name: Run Worker checks
        working-directory: world-worker
        run: |
          npm run typecheck
          npm test
      - name: Create private Wrangler configuration
        working-directory: world-worker
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          template = Path('wrangler.toml.example').read_text()
          placeholder = 'REPLACE_WITH_YOUR_D1_DATABASE_ID'
          assert template.count(placeholder) == 1, 'Wrangler template must contain the expected D1 placeholder once'
          Path('wrangler.toml').write_text(template.replace(placeholder, os.environ['D1_DATABASE_ID']))
          PY
      - name: Verify Nimo is asleep before migrating
        working-directory: world-worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute nimo-world --remote --json --command 'SELECT autonomous_enabled FROM world_control WHERE id=1' > "$RUNNER_TEMP/nimo-sleep.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          payload = json.loads((Path(os.environ['RUNNER_TEMP']) / 'nimo-sleep.json').read_text())
          entries = payload if isinstance(payload, list) else [payload]
          states = [row.get('autonomous_enabled') for entry in entries for row in entry.get('results', [])]
          if states != [0]:
              raise SystemExit('Nimo is not confirmed asleep in D1. Stop: put Nimo to sleep under /world/settings first.')
          print('Confirmed asleep in the production D1 database.')
          PY
      - name: Apply additive 003.1 migration
        working-directory: world-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: npx wrangler d1 execute nimo-world --remote --file=migrations/006_journeys_and_vision.sql
      - name: Apply additive 003.2A migration
        if: ${{ inputs.version == '003.2A' || inputs.version == 'current-main' }}
        working-directory: world-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: npx wrangler d1 execute nimo-world --remote --file=migrations/007_object_memory_and_actions.sql
      - name: Deploy Worker after successful migrations
        working-directory: world-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy
