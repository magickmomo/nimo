name: Deploy Nimo World Worker (manual and migration-safe)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release to deploy (current-main includes reward migration 008)'
        required: true
        type: choice
        options:
          - '003.1'
          - '003.2A'
          - 'current-main'
      confirm:
        description: 'Type DEPLOY after putting Nimo to sleep and backing up D1'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nimo-world-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirm == 'DEPLOY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
      D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
      WORKER_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          for key in CLOUDFLARE_ACCOUNT_ID D1_DATABASE_ID D1_API_TOKEN WORKER_API_TOKEN; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing required GitHub secret/variable: $key"
              exit 1
            fi
          done
          if [[ ! "$D1_DATABASE_ID" =~ ^[0-9a-fA-F-]{36}$ ]]; then
            echo "::error::CLOUDFLARE_D1_DATABASE_ID must be a UUID."
            exit 1
          fi
      - name: Check out the exact release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version == 'current-main' && 'main' || (inputs.version == '003.2A' && 'feature/nimo-0032a-object-memory-action-monitor' || 'feature/nimo-003-vision-navigation') }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Worker dependencies
        working-directory: world-worker
        run: npm install --no-audit --no-fund
      - name: Run Worker checks
        working-directory: world-worker
        run: |
          npm run typecheck
          npm test
      - name: Create private Wrangler configuration
        working-directory: world-worker
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          template = Path('wrangler.toml.example').read_text()
          placeholder = 'REPLACE_WITH_YOUR_D1_DATABASE_ID'
          assert template.count(placeholder) == 1, 'Wrangler template must contain the expected D1 placeholder once'
          Path('wrangler.toml').write_text(template.replace(placeholder, os.environ['D1_DATABASE_ID']))
          PY
      - name: Verify Nimo is asleep before migrating
        working-directory: world-worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute nimo-world --remote --json --command 'SELECT autonomous_enabled FROM world_control WHERE id=1' > "$RUNNER_TEMP/nimo-sleep.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          payload = json.loads((Path(os.environ['RUNNER_TEMP']) / 'nimo-sleep.json').read_text())
          entries = payload if isinstance(payload, list) else [payload]
          states = [row.get('autonomous_enabled') for entry in entries for row in entry.get('results', [])]
          if states != [0]:
              raise SystemExit('Nimo is not confirmed asleep in D1. Stop: put Nimo to sleep under /world/settings first.')
          print('Confirmed asleep in the production D1 database.')
          PY
      - name: Apply additive 003.1 migration
        working-directory: world-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: npx wrangler d1 execute nimo-world --remote --file=migrations/006_journeys_and_vision.sql
      - name: Apply additive 003.2A migration
        if: ${{ inputs.version == '003.2A' || inputs.version == 'current-main' }}
        working-directory: world-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: npx wrangler d1 execute nimo-world --remote --file=migrations/007_object_memory_and_actions.sql
      - name: Apply additive reward migration 008
        if: ${{ inputs.version == 'current-main' }}
        working-directory: world-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: npx wrangler d1 execute nimo-world --remote --file=migrations/008_world_rewards.sql

      - name: Verify reward ledger on remote D1 before deployment
        if: ${{ inputs.version == 'current-main' }}
        working-directory: world-worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute nimo-world --remote --json --command "SELECT name FROM sqlite_master WHERE type='table' AND name='world_rewards'" > "$RUNNER_TEMP/nimo-rewards-schema.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads((Path(os.environ['RUNNER_TEMP']) / 'nimo-rewards-schema.json').read_text())
          entries=data if isinstance(data,list) else [data]
          if not entries or not all(entry.get('success') is True for entry in entries):
              raise SystemExit('D1 reward schema verification failed. Refusing to deploy.')
          names={row.get('name') for entry in entries for row in entry.get('results',[])}
          if 'world_rewards' not in names:
              raise SystemExit('Reward table not found in production D1. Refusing to deploy.')
          print('Verified world_rewards table in remote D1.')
          PY

      - name: Migrate live world to 16x16 before Worker deployment
        if: ${{ inputs.version == 'current-main' }}
        working-directory: world-worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute nimo-world --remote --json --command "SELECT sql FROM sqlite_master WHERE type='table' AND name='world_position'" > "$RUNNER_TEMP/nimo-position-schema.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads((Path(os.environ['RUNNER_TEMP'])/'nimo-position-schema.json').read_text())
          entries=data if isinstance(data,list) else [data]
          sql=[row.get('sql','') for entry in entries for row in entry.get('results',[])]
          if len(sql)!=1: raise SystemExit('Missing world_position table; refusing deployment')
          if 'BETWEEN 0 AND 15' in sql[0]:
              Path(os.environ['RUNNER_TEMP'],'nimo-migrate-016').write_text('skip')
          elif 'BETWEEN 0 AND 8' in sql[0]:
              Path(os.environ['RUNNER_TEMP'],'nimo-migrate-016').write_text('apply')
          else:
              raise SystemExit('Unexpected coordinate constraints; refusing deployment')
          PY
          if [[ "$(cat "$RUNNER_TEMP/nimo-migrate-016")" == 'apply' ]]; then
            npx wrangler d1 execute nimo-world --remote --file=migrations/010_world_16x16.sql
          else
            echo '16x16 coordinate schema already migrated.'
          fi
          npx wrangler d1 execute nimo-world --remote --json --command "SELECT sql FROM sqlite_master WHERE type='table' AND name='world_position'" > "$RUNNER_TEMP/nimo-position-verified.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads((Path(os.environ['RUNNER_TEMP'])/'nimo-position-verified.json').read_text())
          entries=data if isinstance(data,list) else [data]
          sql=[row.get('sql','') for entry in entries for row in entry.get('results',[])]
          if len(sql)!=1 or 'BETWEEN 0 AND 15' not in sql[0]:
              raise SystemExit('16x16 migration verification failed; do not deploy Worker')
          print('Verified expanded coordinate schema.')
          PY

      - name: Create and verify allotment tables before Worker deployment
        if: ${{ inputs.version == 'current-main' }}
        working-directory: world-worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute nimo-world --remote --file=migrations/011_allotment_economy.sql
          npx wrangler d1 execute nimo-world --remote --json --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('garden_inventory','garden_plots','garden_transactions')" > "$RUNNER_TEMP/nimo-garden-schema.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          data=json.loads((Path(os.environ["RUNNER_TEMP"])/"nimo-garden-schema.json").read_text())
          entries=data if isinstance(data,list) else [data]
          if any(entry.get("success") is not True for entry in entries):
              raise SystemExit("Garden D1 schema query failed")
          names={r.get("name") for e in entries for r in e.get("results",[])}
          if names!={"garden_inventory","garden_plots","garden_transactions"}:
              raise SystemExit("Garden D1 migration incomplete; refusing deployment")
          print("Verified allotment tables")
          PY

      - name: Set existing Nimo fullness decay to 1 percent per minute once
        if: ${{ inputs.version == 'current-main' }}
        working-directory: world-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: npx wrangler d1 execute nimo-world --remote --file=migrations/012_fullness_rate.sql

      - name: Apply and verify consolidated memory migration 013
        if: ${{ inputs.version == 'current-main' }}
        working-directory: world-worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute nimo-world --remote --file=migrations/013_consolidated_memories.sql
          npx wrangler d1 execute nimo-world --remote --file=migrations/014_unify_legacy_memories.sql
          npx wrangler d1 execute nimo-world --remote --json --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('consolidated_memories_v2','memory_evidence_v2')" > "$RUNNER_TEMP/nimo-memory-schema.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads((Path(os.environ['RUNNER_TEMP'])/'nimo-memory-schema.json').read_text())
          entries=data if isinstance(data,list) else [data]
          names={row.get('name') for entry in entries for row in entry.get('results',[])}
          if names != {'consolidated_memories_v2','memory_evidence_v2'}:
              raise SystemExit('Consolidated memory migration incomplete; refusing deployment')
          print('Verified consolidated memory schema.')
          PY

      - name: Apply and verify request/project migration 015
        if: ${{ inputs.version == 'current-main' }}
        working-directory: world-worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute nimo-world --remote --file=migrations/015_requests_projects.sql
          npx wrangler d1 execute nimo-world --remote --file=migrations/016_creator_request_responses.sql
          npx wrangler d1 execute nimo-world --remote --json --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('creator_requests','nimo_projects','creator_request_responses')" > "$RUNNER_TEMP/nimo-new-schema.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          data=json.loads((Path(os.environ['RUNNER_TEMP'])/'nimo-new-schema.json').read_text())
          entries=data if isinstance(data,list) else [data]
          names={r.get('name') for e in entries for r in e.get('results',[])}
          if names != {'creator_requests','nimo_projects','creator_request_responses'}:
              raise SystemExit('Request/project schema incomplete; refusing deployment')
          print('Verified requests and projects.')
          PY

      - name: Deploy Worker after successful migrations
        working-directory: world-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy
