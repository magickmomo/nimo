name: Run World 004 fast briefing experiment (120 decisions)

on:
  push:
    branches: [main]
    paths: ['.github/workflows/nimo-world-004-fast-briefing.yml']
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RUN-004-FAST to run up to 120 rapid decisions'
        required: false
        type: string
      revision:
        description: 'Exact fast-runner PR #137 head commit SHA'
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read
  checks: read

concurrency:
  group: nimo-world-004-deployment
  cancel-in-progress: false

jobs:
  activate:
    if: ${{ github.event_name == 'push' || (inputs.confirm == 'RUN-004-FAST' && inputs.revision != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: world-004
    env:
      REVISION: d8dad0e316ee9bf387a7739bc5e530f239113822
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORLD_004_API_TOKEN }}
      CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
    steps:
      - name: Verify selected ready World 004 PR head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ env.REVISION }}
        run: |
          set -euo pipefail
          [[ "$REVISION" =~ ^[a-f0-9]{40}$ ]] || { echo "::error::Full commit SHA required"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/pulls/137" > "$RUNNER_TEMP/pr.json"
          test "$(jq -r '.head.sha' "$RUNNER_TEMP/pr.json")" = "$REVISION" || { echo "::error::PR head has changed"; exit 1; }
          test "$(jq -r '.base.ref' "$RUNNER_TEMP/pr.json")" = "experiment/world-004-static-world-briefing" || { echo "::error::Wrong PR base"; exit 1; }
          # The exact checked-out revision is typechecked and tested in this job.
          # GitHub checks can be unavailable for later draft-PR follow-up commits.

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REVISION }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check code and safe inactive configuration
        working-directory: world-worker
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run typecheck
          npm test
          npm run check:world004
          grep -q 'world004GenerationContext(world,choice,args.hasVisitor)' src/world-004-decision.ts
          grep -q 'WORLD_004_STATIC_BRIEFING' src/world-004-decision.ts
          grep -q 'WORLD_004_FAST_MODE' src/index.ts
          grep -q '^WORLD_004_ENABLED = "false"$' wrangler.world-004.toml
          ! grep -q '^crons\s*=' wrangler.world-004.toml

      - name: Verify both credentials and isolated D1 starting state
        shell: bash
        working-directory: world-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_D1_API_TOKEN"
          npx wrangler d1 execute nimo-world-004 --remote --config wrangler.world-004.toml --json --command "SELECT (SELECT autonomous_enabled FROM world_control WHERE id=1) AS enabled, (SELECT COUNT(*) FROM decisions) AS decisions, (SELECT COUNT(*) FROM events) AS events" > "$RUNNER_TEMP/canary-start.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          payload=json.loads((Path(os.environ['RUNNER_TEMP'])/'canary-start.json').read_text())
          rows=[v for entry in payload for v in entry.get('results',[])]
          assert len(rows)==1 and rows[0]['events']>=11000, 'World 004 clone missing'
          assert rows[0]['enabled'] in (0,1), 'Invalid World 004 control state'
          assert rows[0]['decisions']>=88, 'Previous World 004 run not present'
          print('World 004 historical data present; previous decisions preserved')
          PY

      - name: Schedule next safe UK one-hour window and enable isolated canary
        working-directory: world-worker
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime,timezone,timedelta,time
          from zoneinfo import ZoneInfo
          import os
          localzone=ZoneInfo("Europe/London")
          local=datetime.now(timezone.utc).astimezone(localzone)
          ready=local+timedelta(minutes=2)
          candidate=ready.replace(second=0,microsecond=0)+timedelta(minutes=1)
          if candidate.hour<6:
              candidate=datetime.combine(candidate.date(),time(6),tzinfo=localzone)
          elif candidate.hour>=20:
              candidate=datetime.combine(candidate.date()+timedelta(days=1),time(6),tzinfo=localzone)
          start=candidate.astimezone(timezone.utc)
          stop=min(start+timedelta(hours=6),datetime.combine(start.astimezone(localzone).date(),time(22),tzinfo=localzone).astimezone(timezone.utc))
          assert start>datetime.now(timezone.utc)+timedelta(minutes=1)
          assert start.astimezone(localzone).hour>=6
          assert stop.astimezone(localzone).hour<=22
          path=Path('wrangler.world-004.toml')
          config=path.read_text()
          replacements={
            'WORLD_004_ENABLED = "false"':'WORLD_004_ENABLED = "true"',
            'WORLD_004_START_AT = "1970-01-01T00:00:00.000Z"':'WORLD_004_START_AT = "'+start.isoformat(timespec='milliseconds').replace('+00:00','Z')+'"',
            'WORLD_004_STOP_AT = "1970-01-01T00:00:00.000Z"':'WORLD_004_STOP_AT = "'+stop.isoformat(timespec='milliseconds').replace('+00:00','Z')+'"',
          }
          for before,after in replacements.items():
              assert config.count(before)==1, 'Unexpected World 004 configuration'
              config=config.replace(before,after)
          assert 'name = "nimo-world-004"' in config
          assert 'database_name = "nimo-world-004"' in config
          assert 'bucket_name = "nimo-world-004-archives"' in config
          assert '[triggers]' not in config
          config=config.replace('MEMORY_CONSOLIDATION_ENABLED = "true"','MEMORY_CONSOLIDATION_ENABLED = "false"')
          config+='\nWORLD_004_FAST_MODE = "true"\n'
          assert 'MEMORY_CONSOLIDATION_ENABLED = "false"' in config
          config+='\n[triggers]\ncrons = ["* * * * *"]\n'
          path.write_text(config)
          with open(Path(os.environ['RUNNER_TEMP'])/'canary-window.txt','w') as f:
              f.write(start.isoformat()+'\n'+stop.isoformat()+'\n')
          print('One-hour World 004 experiment: '+start.isoformat()+' to '+stop.isoformat())
          PY
          grep -q '^WORLD_004_ENABLED = "true"$' wrangler.world-004.toml
          grep -q '^WORLD_004_MAX_RUN_DECISIONS = "120"$' wrangler.world-004.toml
          grep -q '^crons = \["\* \* \* \* \*"\]$' wrangler.world-004.toml

      - name: Deploy only World 004 with scheduled hard stop
        working-directory: world-worker
        run: npx wrangler deploy --config wrangler.world-004.toml

      - name: Arm the isolated owner control without issuing a model request
        working-directory: world-worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute nimo-world-004 --remote --config wrangler.world-004.toml --json --command "UPDATE world_control SET autonomous_enabled=1, updated_at=datetime('now') WHERE id=1" > "$RUNNER_TEMP/armed.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          payload=json.loads((Path(os.environ['RUNNER_TEMP'])/'armed.json').read_text())
          assert len(payload)==1 and payload[0].get('success') is True
          # Verify the resulting control state below. Wrangler metadata format
          # varies by version and is not used to determine whether arming worked.
          PY
          npx wrangler d1 execute nimo-world-004 --remote --config wrangler.world-004.toml --json --command "SELECT autonomous_enabled FROM world_control WHERE id=1" > "$RUNNER_TEMP/verify.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          data=json.loads((Path(os.environ['RUNNER_TEMP'])/'verify.json').read_text())
          assert data[0]['results']==[{'autonomous_enabled':1}]
          PY

      - name: Record experiment plan and export links
        shell: bash
        run: |
          {
            echo '## World 004 fast 120-decision briefing experiment'
            echo 'Autonomy start and hard stop (UTC):'
            cat "$RUNNER_TEMP/canary-window.txt"
            echo ''
            echo 'Decision maximum: 120 in this fast-run window; prior decision/event rows retained.'
            echo 'Treatment revision: d8dad0e316ee9bf387a7739bc5e530f239113822 (PR #137).'
            echo 'Worker: nimo-world-004; D1: nimo-world-004; archive: nimo-world-004-archives.'
            echo 'Model calls are blocked by the absolute start/stop guard outside the window.'
            echo 'Treatment: static world briefing for Decisions selector only; compact Responses generation unchanged.'
            echo 'Memory consolidation disabled during controlled test (same as previous run).'
            echo 'Baseline: 2026-11-25T13:30:00.000Z to 2026-11-25T14:30:00.000Z; compare action distribution, multi-step behaviour, generation tokens and failures.'
            echo 'Pacing differs from baseline: accelerated walking and no 30s decision cooldown.'
            echo 'Run the Stage 1 evidence/Codex evaluation manually with the start/stop UTC timestamps above.'
            echo 'Owner-only experiment export: https://nimo-world-004.vercel.app/api/world/experiment/export'
            echo 'Owner-only decision contexts: https://nimo-world-004.vercel.app/api/world/decision-context/export?date=YYYY-MM-DD'
          } >> "$GITHUB_STEP_SUMMARY"
