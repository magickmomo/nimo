name = "nimo-world"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Cron is required for autonomous decisions even when no one visits the site.
[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "nimo-world"
database_id = "adf7b04a-0a03-40b7-8389-b02d7339a31f"

# Private R2 bucket for complete 24-hour experience archives.
# Create with: npx wrangler r2 bucket create nimo-daily-archives
[[r2_buckets]]
binding = "ARCHIVES"
bucket_name = "nimo-daily-archives"

[vars]
OPENAI_MODEL = "gpt-6-luna"
# Run persisted hourly memory reviews automatically; the cursor prevents replays.
MEMORY_CONSOLIDATION_ENABLED = "true"
